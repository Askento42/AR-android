  <style>
    :root{
      --bg:#240303;
      --bg2:#4b0b0d;
      --glass:rgba(255,255,255,.08);
      --card:rgba(255,255,255,.12);
      --stroke:rgba(255,255,255,.18);
      --txt:#faf6f2;
      --muted:#e5d8cfcc;
      --brand:#caa37f; /* тёплый беж под фон */
      --brand-strong:#b78b60;
      --accent:#ffd9a0;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--txt); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, var(--bg2), transparent 60%),
                  radial-gradient(1000px 900px at 80% 20%, #3a0a0c, transparent 60%),
                  #1a0203 url("./assets/posters/fon.jpg") center/cover no-repeat fixed;
      backdrop-filter: blur(0px);
    }
    .wrap{
      max-width:1200px; margin:0 auto; padding:24px 18px 48px;
    }
    header{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:10px 14px; border:1px solid var(--stroke); border-radius:calc(var(--radius) + 6px);
      background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
      box-shadow: var(--shadow);
      position:sticky; top:14px; z-index:10; backdrop-filter: blur(6px);
    }
    .brand{
      display:flex; align-items:center; gap:14px;
    }
    .brand img{
      width:56px; height:56px; border-radius:50%; box-shadow:0 6px 18px rgba(0,0,0,.45);
      background:#5b0d10; object-fit:cover;
    }
    .brand h1{
      margin:0; font-size:20px; letter-spacing:.4px; line-height:1.1;
    }
    .brand small{display:block; color:var(--muted); font-weight:500; margin-top:2px}

    .cta{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .btn{
      appearance:none; border:none; cursor:pointer; text-decoration:none; color:#2b1608;
      background:var(--brand); font-weight:700; padding:10px 16px; border-radius:999px;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), 0 6px 14px rgba(202,163,127,.25);
      transition:.2s transform, .2s box-shadow, .2s background;
    }
    .btn:hover{ transform:translateY(-1px); box-shadow:inset 0 0 0 1px rgba(0,0,0,.1), 0 10px 22px rgba(202,163,127,.32)}
    .btn.alt{ background:transparent; color:var(--accent); border:1px solid var(--accent) }
    .pill{ padding:6px 12px; font-weight:600; font-size:13px; border:1px dashed var(--stroke); color:var(--muted); border-radius:999px }

    main{
      margin-top:22px; display:grid; grid-template-columns: 340px 1fr; gap:18px;
    }
    @media (max-width: 960px){
      main{ grid-template-columns: 1fr; }
    }

    /* Sidebar: categories + items list */
    .panel{
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      border:1px solid var(--stroke); border-radius:var(--radius); box-shadow:var(--shadow);
      overflow:hidden;
    }
    .panel .head{ padding:16px 16px 8px; display:flex; align-items:center; justify-content:space-between; gap:10px }
    .search{ width:100%; display:flex; gap:8px; }
    .search input{
      width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--stroke);
      background:rgba(255,255,255,.08); color:var(--txt); outline:none;
    }

    .cats{ display:grid; grid-template-columns:1fr; gap:8px; padding:10px 12px 14px; }
    .cat{
      text-align:left; padding:12px 14px; border-radius:12px; cursor:pointer;
      background:rgba(255,255,255,.05); border:1px solid transparent; color:var(--txt);
      font-weight:600; letter-spacing:.2px; transition:.18s background, .18s border, .18s transform;
    }
    .cat:hover{ background:rgba(255,255,255,.09) }
    .cat.active{ background:rgba(255,255,255,.16); border-color:var(--brand-strong) }

    .items{ border-top:1px dashed var(--stroke); padding:12px }
    .item{
      display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:12px; cursor:pointer;
      border:1px solid transparent; transition:.18s background, .18s border;
    }
    .item:hover{ background:rgba(255,255,255,.08) }
    .item.active{ border-color:var(--brand-strong); background:rgba(255,255,255,.12) }
    .item .badge{
      width:38px; height:38px; display:grid; place-items:center; border-radius:12px; font-weight:800;
      background:#6b3b2a; color:#ffe9d0; border:1px solid rgba(255,255,255,.22)
    }
    .meta{ color:var(--muted); font-size:12px; margin-top:2px }

    /* Detail */
    .detail{
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      border:1px solid var(--stroke); border-radius:var(--radius); box-shadow:var(--shadow);
      padding:16px;
      display:grid; grid-template-columns: 1fr 1fr; gap:16px;
    }
    @media (max-width:960px){ .detail{ grid-template-columns: 1fr; } }

    .photo{
      aspect-ratio: 4/3; width:100%; border-radius:18px; overflow:hidden; position:relative;
      background:rgba(0,0,0,.2);
      border:1px solid rgba(255,255,255,.2)
    }
    .photo img{
      width:100%; height:100%; object-fit:cover; display:block;
      filter: contrast(1.05) saturate(1.08);
      transform: scale(1.02);
    }
    .empty{
      display:grid; place-items:center; color:#fff8; font-weight:600; letter-spacing:.3px; height:100%;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,.06), rgba(255,255,255,.06) 10px, rgba(0,0,0,.1) 10px, rgba(0,0,0,.1) 20px);
    }

    .d-info h2{ margin:0 0 8px; font-size:26px }
    .price{ font-size:22px; font-weight:800; color:var(--accent); margin:4px 0 10px }
    .d-rows{ display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 16px }
    .chip{
      padding:8px 12px; border-radius:999px; border:1px solid var(--stroke); background:rgba(255,255,255,.06); color:var(--muted);
      font-weight:600; font-size:13px;
    }
    .d-actions{ display:flex; gap:10px; flex-wrap:wrap }
    .btn.ghost{ background:transparent; color:var(--brand); border:1px solid var(--brand); }
    .note{ margin-top:10px; color:var(--muted); font-size:13px }

    /* Fade */
    .fade{ animation: fade .22s ease-out }
    @keyframes fade { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  </style>
</head>

    "tom-yam":"https://static.tildacdn.one/tild6630-3936-4238-a531-303333633265/DSC00458.jpg",
    // ПТИЦА — отдельно от супа!
    "chicken-tomyum":"https://static.tildacdn.one/tild6630-3936-4238-a531-303333633265/DSC00458.jpg",

    // (при желании добавь сюда остальные блюда; плейсхолдер сработает, если ссылки нет)
  };

  // ====== UI ======
  const catsEl = document.getElementById('cats');
  const itemsEl = document.getElementById('items');
  const photoEl = document.getElementById('photo');
  const titleEl = document.getElementById('title');
  const priceEl = document.getElementById('price');
  const gramsEl = document.getElementById('grams');
  const catEl = document.getElementById('cat');
  const glbBtn = document.getElementById('glbBtn');
  const usdzBtn = document.getElementById('usdzBtn');
  const callBtn = document.getElementById('callBtn');
  const reserveBtn = document.getElementById('reserveBtn');
  const waBtn = document.getElementById('waBtn');
  const q = document.getElementById('q');

  reserveBtn.href = MENU.brand.reserve;
  callBtn.href = MENU.brand.reserve;
  waBtn.href = MENU.brand.whatsapp;

  let activeCat = MENU.categories[0];
  let activeItemId = null;

  function renderCats(){
    catsEl.innerHTML = '';
    MENU.categories.forEach(cat=>{
      const div = document.createElement('button');
      div.className = 'cat' + (cat===activeCat?' active':'');
      div.textContent = cat;
      div.onclick = ()=>{ activeCat = cat; activeItemId = null; renderCats(); renderItems(); clearDetail(); };
      catsEl.appendChild(div);
    });
  }

  function filteredItems(){
    const term = q.value.trim().toLowerCase();
    return MENU.items.filter(x => x.category===activeCat && (term ? x.title.toLowerCase().includes(term) : true));
  }

  function renderItems(){
    itemsEl.innerHTML = '';
    const list = filteredItems();
    list.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'item' + (it.id===activeItemId?' active':'');
      row.onclick = ()=>{ activeItemId = it.id; highlightItems(); showDetail(it); };
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = (it.title || '?').trim().charAt(0).toUpperCase();
      const col = document.createElement('div');
      col.innerHTML = `<div style="font-weight:700">${it.title}</div><div class="meta">${it.grams} • ${it.price} ${it.currency.toUpperCase()}</div>`;
      row.appendChild(badge); row.appendChild(col);
      itemsEl.appendChild(row);
    });
    if(!list.length){
      const empty = document.createElement('div');
      empty.className='meta'; empty.style.padding='14px';
      empty.textContent='Нет позиций по фильтру.';
      itemsEl.appendChild(empty);
    }
  }

  function highlightItems(){
    itemsEl.querySelectorAll('.item').forEach(el=> el.classList.remove('active'));
    const idx = [...itemsEl.children].findIndex(el => el.onclick && MENU.items.some(x=>x.id===activeItemId && el.onclick.toString().includes(activeItemId)));
    if(idx>-1) itemsEl.children[idx].classList.add('active');
  }

  function clearDetail(){
    photoEl.innerHTML = '<div class="empty">Выберите блюдо</div>';
    titleEl.textContent = '—';
    priceEl.textContent = '—';
    gramsEl.textContent = '—';
    catEl.textContent = activeCat || '—';
    glbBtn.style.display = 'none';
    usdzBtn.style.display = 'none';
  }

  function showDetail(it){
    // Фото
    const src = itemImages[it.id];
    if(src){
      photoEl.innerHTML = '';
      const img = new Image();
      img.loading = 'lazy';
      img.src = src;
      img.alt = it.title;
      photoEl.appendChild(img);
    } else {
      photoEl.innerHTML = '<div class="empty">Фото скоро</div>';
    }
    // Текст
    titleEl.textContent = it.title;
    priceEl.textContent = `${it.price} ${String(it.currency || '').toUpperCase()}`;
    gramsEl.textContent = it.grams || '';
    catEl.textContent = it.category;

    // 3D
    const hasGlb = it.model && it.model.glb;
    const hasUsdz = it.model && it.model.usdz;
    glbBtn.style.display = hasGlb ? '' : 'none';
    usdzBtn.style.display = hasUsdz ? '' : 'none';
    if(hasGlb) glbBtn.href = it.model.glb;
    if(hasUsdz) usdzBtn.href = it.model.usdz;
  }

  q.addEventListener('input', renderItems);

  // Инициализация
  renderCats();
  renderItems();
  clearDetail();
  </script>
</body>
</html>
