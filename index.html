<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Seven — AR Menu (Premium High-Tech)</title>
  <meta name="description" content="Seven Restaurant — Interactive AR Menu (High-Tech Premium UI)"/>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700&display=swap" rel="stylesheet"/>

  <!-- Icons (SVGs used inline; link kept for reference) -->
  <link rel="preconnect" href="https://www.svgrepo.com"/>

  <!-- Base styles (High-Tech Premium: glass + gold accents) -->
  <style>
    :root{
      --bg-1:#0f0f0f;
      --bg-2:#1b1b1b;
      --text:#f5f5f5;
      --muted:#cfcfcf;
      --gold:#d4b483;
      --bordo:#b22222;
      --glass: rgba(255,255,255,0.06);
      --glass-strong: rgba(255,255,255,0.12);
      --shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      --blur: blur(12px);
      --radius-lg:20px;
      --radius-md:16px;
      --radius-sm:12px;
      --speed:.25s;
      --ring: 0 0 0 1px rgba(212,180,131,.35), 0 0 25px rgba(212,180,131,.12);
      --glow: 0 0 0 0 rgba(212,180,131,0);
    }

    /* Page background (image overlay + dark radial) */
    body{
      margin:0;
      min-height:100dvh;
      color:var(--text);
      font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 70% -10%, rgba(178,34,34,.25), transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2)) ,
        url("https://images.unsplash.com/photo-1601597111228-338c8f6dc3c6?auto=format&fit=crop&w=1920&q=80") center/cover no-repeat fixed;
      background-blend-mode: overlay, normal, multiply;
    }

    a{ color:inherit; text-decoration:none; }

    .wrap{
      max-width:1200px;
      padding:32px 20px 80px;
      margin:0 auto;
    }

    /* Topbar */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:22px;
    }
    .brand-btn{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background:var(--glass);
      backdrop-filter:var(--blur);
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.12);
      transition:transform var(--speed), box-shadow var(--speed), border-color var(--speed);
    }
    .brand-btn:hover{ transform:translateY(-1px); box-shadow:var(--ring); border-color:rgba(212,180,131,.35); }
    .call-btn{
      padding:10px 16px;
      border-radius:999px;
      background:linear-gradient(180deg, rgba(212,180,131,.18), rgba(212,180,131,.10));
      border:1px solid rgba(212,180,131,.45);
      box-shadow: 0 0 0 1px rgba(212,180,131,.25), 0 8px 30px rgba(212,180,131,.12);
      font-weight:600;
      letter-spacing:.2px;
      transition:filter var(--speed), transform var(--speed);
    }
    .call-btn:hover{ filter:brightness(1.1); transform:translateY(-1px); }

    /* Logo + headline */
    .hero{
      display:flex; flex-direction:column; align-items:center; gap:14px;
      margin:10px 0 26px;
      text-align:center;
    }
    .logo{
      width:86px; height:86px; border-radius:50%;
      background:radial-gradient(55% 55% at 50% 45%, #3b0000, #1a0000 60%);
      display:grid; place-items:center;
      box-shadow: 0 0 0 2px rgba(212,180,131,.35), 0 0 35px rgba(212,180,131,.18), inset 0 0 22px rgba(212,180,131,.18);
      position:relative; overflow:hidden;
    }
    .logo:before{
      content:"7";
      font-family:"Poppins", system-ui, sans-serif;
      font-size:40px; font-weight:700;
      color:var(--gold);
      text-shadow:0 0 16px rgba(212,180,131,.45);
      transform:translateY(1px);
    }
    .hero h1{
      margin:0;
      font-family:"Poppins", system-ui, sans-serif;
      font-size:28px; letter-spacing:.5px;
      text-shadow:0 1px 0 rgba(0,0,0,.6);
    }

    /* Category grid (glass buttons) */
    .cat-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
      margin: 22px auto 34px;
      max-width:760px;
    }
    @media (min-width:720px){
      .cat-grid{ grid-template-columns: repeat(2, 1fr); }
    }
    .cat{
      padding:16px 18px;
      border-radius:var(--radius-lg);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      backdrop-filter:var(--blur);
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.14);
      display:flex; align-items:center; justify-content:center;
      font-weight:600;
      letter-spacing:.2px;
      transition:transform var(--speed), box-shadow var(--speed), border-color var(--speed);
      position:relative; overflow:hidden;
    }
    .cat:after{
      content:"";
      position:absolute; inset:-1px;
      border-radius:inherit;
      box-shadow: inset 0 0 0 1px rgba(212,180,131,.28);
      pointer-events:none;
    }
    .cat:hover{
      transform:translateY(-2px);
      box-shadow:var(--ring);
      border-color:rgba(212,180,131,.35);
    }

    /* List + preview layout */
    .panel{
      display:grid; gap:20px;
      grid-template-columns:1fr;
    }
    @media (min-width:980px){
      .panel{ grid-template-columns: 420px 1fr; }
    }

    .list{
      padding:14px;
      border-radius:var(--radius-lg);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      backdrop-filter:var(--blur);
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.14);
      min-height:420px;
    }

    .list-title{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; margin:6px 6px 14px;
    }
    .list-title h2{
      margin:0; font-size:18px; font-weight:600; letter-spacing:.2px;
      display:flex; align-items:center; gap:10px;
    }
    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      font-size:12px; padding:3px 8px; border-radius:999px;
      background:rgba(212,180,131,.14);
      border:1px solid rgba(212,180,131,.35);
      color:var(--gold);
    }

    .item{
      display:grid; grid-template-columns:56px 1fr;
      gap:12px; align-items:center;
      padding:12px 10px;
      border-radius:var(--radius-md);
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.02);
      cursor:pointer;
      transition:background var(--speed), transform var(--speed), border-color var(--speed);
      margin:8px 4px;
    }
    .item:hover{ background:rgba(255,255,255,.06); border-color:rgba(212,180,131,.28); transform:translateY(-1px); }
    .item.active{ background:rgba(212,180,131,.10); border-color:rgba(212,180,131,.45); }

    .avatar{
      width:56px; height:56px; border-radius:14px;
      background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.14);
      display:grid; place-items:center;
      font-weight:700; font-family:"Poppins";
      color:var(--gold);
    }

    .meta-title{ font-weight:600; }
    .meta-sub{ font-size:12px; color:var(--muted); margin-top:4px; }

    .preview{
      padding:14px;
      border-radius:var(--radius-lg);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      backdrop-filter:var(--blur);
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.14);
      min-height:420px;
      display:flex; flex-direction:column; gap:14px;
    }

    .canvas{
      aspect-ratio: 16/9;
      border-radius:var(--radius-lg);
      background:
        radial-gradient(120px 60px at 50% 85%, rgba(212,180,131,.25), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.14);
      background-size:cover; background-position:center;
      display:grid; place-items:center;
    }
    .canvas img{
      max-width:100%; max-height:100%;
      display:block; object-fit:contain;
      filter: drop-shadow(0 25px 30px rgba(0,0,0,.55));
    }

    .p-title{
      font-family:"Poppins"; font-size:22px; margin:6px 4px 0;
      letter-spacing:.3px;
    }
    .price{
      margin-left:auto; font-weight:700;
      color:var(--gold);
      border:1px solid rgba(212,180,131,.45);
      padding:6px 10px; border-radius:999px; background:rgba(212,180,131,.08);
    }

    .ar-actions{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .ar-btn{
      padding:10px 14px; border-radius:999px;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border:1px solid rgba(212,180,131,.35);
      color:var(--gold); font-weight:600; letter-spacing:.2px;
      transition:transform var(--speed), filter var(--speed);
    }
    .ar-btn:hover{ transform:translateY(-1px); filter:brightness(1.1); }

    .footer{
      margin-top:36px; display:flex; justify-content:center;
      opacity:.75; font-size:13px;
    }

    /* Small helper pills */
    .pill{
      display:inline-flex; gap:8px; align-items:center;
      padding:8px 12px; border-radius:999px;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.14);
    }
    .muted{ color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Top bar -->
    <div class="topbar">
      <a class="brand-btn" href="./">
        <!-- back chevron -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="white" opacity=".7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Home
      </a>

      <a class="call-btn" href="tel:+996555000777">
        Call • +996 555 000 777
      </a>
    </div>

    <!-- Brand / Hero -->
    <div class="hero">
      <div class="logo" aria-label="Seven logo"></div>
      <h1>Menu</h1>
      <div class="pill muted">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="white" opacity=".6"/>
          <path d="M8 12h8" stroke="white" opacity=".6"/>
        </svg>
        Interactive AR • Premium UI
      </div>
    </div>

    <!-- Categories -->
    <div id="categories" class="cat-grid" role="navigation" aria-label="Categories"></div>

    <!-- List + Preview -->
    <div class="panel" aria-live="polite">
      <section class="list" aria-label="Items">
        <div class="list-title">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" stroke="white" opacity=".8" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span id="currentCategory">Select a Category</span>
          </h2>
          <span class="badge"><span id="shownCount">0</span> shown</span>
        </div>
        <div id="items"></div>
      </section>

      <aside class="preview">
        <div id="canvas" class="canvas" aria-label="Preview">
          <!-- image will appear here -->
          <img id="previewImg" alt="Preview" style="display:none;"/>
        </div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <div id="previewTitle" class="p-title">Pick a dish…</div>
          <div id="previewPrice" class="price" style="display:none;"></div>
        </div>
        <div id="previewMeta" class="muted" style="margin:2px 4px 6px;"></div>
        <div id="arZone" class="ar-actions"></div>
      </aside>
    </div>

    <div class="footer muted">Seven • Bishkek • © 2025</div>
  </div>

  <!-- Data loader & UI logic
       NOTE: We keep structure & logic simple and compatible with your previous JSON (menu.json).
       The page expects a file `menu.json` in the same folder with the schema you shared earlier. -->
  <script>
    // ---------- Helpers ----------
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

    // A tiny map of known images (you can expand later). If not found — a classy fallback is used.
    const IMAGE_FALLBACK = "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80";
    const IMAGE_MAP = {
      // Soups
      "pumpkin-soup": "https://static.tildacdn.one/tild3763-3435-4366-a238-376131363632/DSC06695.jpg",
      "okroshka": "https://static.tildacdn.one/tild6134-3931-4662-b866-666638303239/DSC06809.jpg",
      "borsch": "https://static.tildacdn.one/tild3465-3365-4135-b738-666638613837/DSC00428.jpg",
      "tom-yam": "https://static.tildacdn.one/tild6630-3936-4238-a531-303333633265/DSC00458.jpg",
      "tajin-soup": "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=80",
      // Poultry (link Tom-Yam Chicken model correctly)
      "chicken-tomyum": "https://images.unsplash.com/photo-1517244683847-7456b63c5969?auto=format&fit=crop&w=1600&q=80",
      "grilled-chicken": "https://images.unsplash.com/photo-1604908554007-51a38d728ef0?auto=format&fit=crop&w=1600&q=80",
      "chicken-cutlet": "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80"
    };

    // Texts (English UI)
    const TXT = {
      home: "Home",
      categories: "Categories",
      selectCategory: "Select a Category",
      shown: "shown",
      call: "Call",
      glb: "GLB",
      usdz: "USDZ",
      grams: "g",
      kg: "kg"
    };

    // ---------- Rendering ----------
    const els = {
      categories: $("#categories"),
      items: $("#items"),
      currentCategory: $("#currentCategory"),
      shownCount: $("#shownCount"),
      previewImg: $("#previewImg"),
      canvas: $("#canvas"),
      previewTitle: $("#previewTitle"),
      previewPrice: $("#previewPrice"),
      previewMeta: $("#previewMeta"),
      arZone: $("#arZone")
    };

    let MENU = null;
    let state = { cat: null, items: [], activeId: null };

    async function loadMenu(){
      try{
        const res = await fetch("menu.json", {cache:"no-store"});
        MENU = await res.json();
        buildCategories(MENU.categories);
        // default open the first category
        if(MENU.categories && MENU.categories.length){
          selectCategory(MENU.categories[0]);
        }
      }catch(e){
        console.error("menu.json load failed", e);
        els.categories.innerHTML = `<div class="muted">menu.json not found. Place it near index.html</div>`;
      }
    }

    function buildCategories(cats){
      els.categories.innerHTML = "";
      cats.forEach(cat=>{
        const a = document.createElement("button");
        a.className = "cat";
        a.type="button";
        a.textContent = cat;
        a.addEventListener("click", ()=>selectCategory(cat));
        els.categories.appendChild(a);
      });
    }

    function selectCategory(cat){
      state.cat = cat;
      const items = MENU.items.filter(it => it.category === cat);
      state.items = items;
      els.items.innerHTML = "";
      els.currentCategory.textContent = cat;
      els.shownCount.textContent = items.length;

      items.forEach((it, idx)=>{
        const row = document.createElement("div");
        row.className = "item";
        row.dataset.id = it.id;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = (it.title || "?").slice(0,1).toUpperCase();

        const meta = document.createElement("div");
        const title = document.createElement("div");
        title.className = "meta-title";
        title.textContent = it.title;

        const sub = document.createElement("div");
        sub.className = "meta-sub";
        sub.textContent = [it.grams || "", (it.price!=null? `${it.price} KGS` : "")].filter(Boolean).join(" • ");

        meta.appendChild(title); meta.appendChild(sub);
        row.appendChild(avatar); row.appendChild(meta);

        row.addEventListener("click", ()=>{
          $$(".item", els.items).forEach(el => el.classList.remove("active"));
          row.classList.add("active");
          state.activeId = it.id;
          showPreview(it);
        });

        els.items.appendChild(row);

        // Auto-select first
        if(idx===0){
          row.classList.add("active");
          state.activeId = it.id;
          showPreview(it);
        }
      });

      if(items.length===0){
        els.items.innerHTML = `<div class="muted" style="padding:8px 6px;">No dishes in this category yet.</div>`;
        resetPreview();
      }
    }

    function resetPreview(){
      els.previewImg.style.display="none";
      els.previewTitle.textContent="Pick a dish…";
      els.previewPrice.style.display="none";
      els.previewMeta.textContent="";
      els.arZone.innerHTML="";
      els.canvas.style.backgroundImage = `url(${IMAGE_FALLBACK})`;
    }

    function showPreview(it){
      const img = IMAGE_MAP[it.id] || IMAGE_FALLBACK;
      els.canvas.style.backgroundImage = "none";
      els.previewImg.src = img;
      els.previewImg.alt = it.title || "Dish image";
      els.previewImg.style.display = "block";

      els.previewTitle.textContent = it.title || "";
      if(typeof it.price === "number"){
        els.previewPrice.style.display="inline-flex";
        els.previewPrice.textContent = `${it.price} KGS`;
      }else{
        els.previewPrice.style.display="none";
      }

      els.previewMeta.textContent = it.grams ? `${it.grams}` : "";

      // AR / model buttons
      els.arZone.innerHTML = "";
      if(it.model && (it.model.glb || it.model.usdz)){
        if(it.model.glb){
          const b = document.createElement("a");
          b.href = it.model.glb;
          b.className = "ar-btn";
          b.target = "_blank";
          b.rel = "noopener";
          b.textContent = "GLB";
          els.arZone.appendChild(b);
        }
        if(it.model.usdz){
          const b2 = document.createElement("a");
          b2.href = it.model.usdz;
          b2.className = "ar-btn";
          b2.target = "_blank";
          b2.rel = "noopener";
          b2.textContent = "USDZ";
          els.arZone.appendChild(b2);
        }
      }
    }

    // Ensure correct AR model binding for Chicken Tom-Yam (id: chicken-tomyum)
    // by mirroring the soup Tom-Yam model if not set in JSON.
    function patchModels(){
      try{
        const tomYamSoup = MENU.items.find(x=>x.id==="tom-yam" && x.model);
        const chickenTY = MENU.items.find(x=>x.id==="chicken-tomyum");
        if(chickenTY && (!chickenTY.model || (!chickenTY.model.glb && !chickenTY.model.usdz)) && tomYamSoup){
          chickenTY.model = { ...tomYamSoup.model };
        }
      }catch(e){ /* safe no-op */ }
    }

    // Boot
    loadMenu().then(()=>{ patchModels(); });
  </script>
</body>
</html>
